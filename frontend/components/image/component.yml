name: Image
machineName: image
status: true
required:
  - image
props:
  properties:
    image:
      title: Image
      type: object
      examples:
        - src: >-
            https://placehold.co/800x600@2x.png?alternateWidths=https%3A%2F%2Fplacehold.co%2F%7Bwidth%7Dx%7Bheight%7D%402x.png
          alt: Example image placeholder
          width: 800
          height: 600
      $ref: json-schema-definitions://canvas.module/image
    aiDisclosure:
      title: AI disclosure
      type: string
      default: none
      examples:
        - none
      enum:
        - none
        - ai_generated
        - ai_assisted
      meta:enum:
        none: No AI disclosure
        ai_generated: AI generated
        ai_assisted: AI assisted
slots: []
